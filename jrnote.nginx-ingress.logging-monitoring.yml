setting:
 https.proxy:
 scraping_url: https://docs.nginx.com/nginx-ingress-controller/
 deepl_enable: false
 deepl_apikey: "todo"

jrnote:
- loggingMonitoringLogging
- loggingMonitoringPrometheus
- loggingMonitoringOpentelemetry
- loggingMonitoringTracing

loggingMonitoringLogging_scraping:
